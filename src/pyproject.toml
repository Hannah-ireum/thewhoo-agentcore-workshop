# 배포 패키징용 의존성 선언 (새 AgentCore CLI 가 이 파일을 읽습니다).
#
# 로컬 개발/Lab 1-4 실행은 루트의 requirements.txt 를 씁니다.
# 두 파일의 버전 범위를 같게 유지하세요 — 어긋나면 "로컬은 되는데 배포는 실패" 가 납니다.
[project]
name = "thewhoo-chat"
version = "0.1.0"
# ⚠️ 3.11 로 둡니다 (>=3.12 로 올리지 마세요).
#    Code Editor 의 setup-python.sh 는 Python 3.11 을 씁니다. 여기가 >=3.12 면
#    `agentcore dev` 가 내부에서 `uv venv` / `uv sync` 를 돌릴 때 프로젝트
#    요구사항과 인터프리터가 어긋나 실패할 수 있습니다:
#      ❌ Failed to create venv: unknown error
#    배포 런타임(PYTHON_3_12)보다 낮은 하한이라 배포에는 문제 없습니다
#    (하한이지 고정이 아님).
requires-python = ">=3.11"
dependencies = [
    # app.py 의 StrandsTelemetry().setup_otlp_exporter() 가 요구하는 것:
    # opentelemetry.exporter.otlp.proto.http (strands 1.52.0 소스 실측).
    # distro 가 전이로 끌어오지만 명시해 두어야 distro 버전 변경에 안전합니다.
    # 이 두 줄이 없으면 배포 컨테이너에서 app.py import 가
    # ModuleNotFoundError: No module named 'opentelemetry.exporter' 로 실패합니다.
    "aws-opentelemetry-distro",
    "opentelemetry-exporter-otlp-proto-http>=1.24.0,<2.0",
    "bedrock-agentcore>=1.9.1,<2.0",
    # ⚠️ 하한을 1.43.0 미만으로 내리면 안 됩니다 (requirements.txt 와 동일하게 유지).
    #    botocore 1.35.0 은 `bedrock-agentcore` 서비스를 아예 모릅니다 (실측):
    #      UnknownServiceError: Unknown service: 'bedrock-agentcore'
    #    또 `namespacePath`(Memory prefix 조회)도 최신 botocore 에만 있습니다.
    #    배포 컨테이너가 낮은 버전으로 해석되면 Runtime 이 import 단계에서 죽습니다.
    "botocore[crt]>=1.43.0,<2.0",
    "boto3>=1.43.0,<2.0",
    "mcp>=1.27.0,<2.0",
    "strands-agents>=1.39.0,<2.0",
    "strands-agents-tools>=0.5.2,<1.0",
    "requests-aws4auth>=1.3.0,<2.0",
    "python-dotenv>=1.0.0,<2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
